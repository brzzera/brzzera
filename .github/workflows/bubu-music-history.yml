name: Bubu music history

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bubu-music-history.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bubu-public-music-history
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Poll Spotify status
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const SOURCE = 'https://kratoiapi.vercel.app/api/listen-now';
          const FILE = 'bubu-music-history.json';
          const sleep = ms => new Promise(r => setTimeout(r, ms));

          let history = [];
          try {
            const raw = JSON.parse(fs.readFileSync(FILE, 'utf8'));
            history = Array.isArray(raw) ? raw.slice(0, 10) : [];
          } catch {}

          function normalize(raw = {}) {
            const track = {
              playing: Boolean(raw.playing),
              name: String(raw.name || ''),
              artist: String(raw.artist || ''),
              album: String(raw.album || ''),
              image: String(raw.image || ''),
              url: String(raw.url || '')
            };
            track.key = (track.url || `${track.name}|${track.artist}|${track.album}`).toLowerCase();
            return track;
          }

          function add(track, listenedAt) {
            if (!track?.playing || !track.name || !track.artist) return false;
            const newest = history[0];
            if (newest?.key === track.key) return false;
            history.unshift({
              key: track.key,
              name: track.name,
              artist: track.artist,
              album: track.album,
              image: track.image,
              url: track.url,
              listened_at: listenedAt || new Date().toISOString()
            });
            history = history.slice(0, 10);
            return true;
          }

          async function poll() {
            try {
              const res = await fetch(SOURCE + '?t=' + Date.now(), {
                cache: 'no-store',
                headers: { accept: 'application/json' }
              });
              if (!res.ok) throw new Error('HTTP ' + res.status);
              const data = await res.json();

              // Prefer Spotify's own recently-played list when the token has the scope.
              if (Array.isArray(data.recent)) {
                const recent = data.recent
                  .filter(x => x?.name && x?.artist)
                  .map(x => ({
                    key: (x.key || x.url || `${x.name}|${x.artist}|${x.album || ''}`).toLowerCase(),
                    name: x.name,
                    artist: x.artist,
                    album: x.album || '',
                    image: x.image || '',
                    url: x.url || '',
                    listened_at: x.listened_at || new Date().toISOString()
                  }));

                const merged = [...recent, ...history]
                  .sort((a,b) => new Date(b.listened_at || 0) - new Date(a.listened_at || 0));
                const seen = new Set();
                history = merged.filter(x => {
                  const id = `${x.key}|${x.listened_at || ''}`;
                  if (!x.key || seen.has(id)) return false;
                  seen.add(id);
                  return true;
                }).slice(0,10);
              }

              add(normalize(data), new Date().toISOString());
              console.log('Now:', data.name || '(idle)', '-', data.artist || '');
            } catch (err) {
              console.error('poll failed:', err?.message || err);
            }
          }

          (async () => {
            // About 3m36s of polling, leaving time to commit before the next 5m run.
            for (let i = 0; i < 13; i++) {
              await poll();
              if (i < 12) await sleep(18000);
            }
            fs.writeFileSync(FILE, JSON.stringify(history.slice(0,10), null, 2) + '\n');
            console.log('Saved', history.length, 'tracks');
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          NODE

      - name: Commit history
        shell: bash
        run: |
          git config user.name "bubu-music-bot"
          git config user.email "actions@users.noreply.github.com"
          git add bubu-music-history.json
          if git diff --cached --quiet; then
            echo "No new track."
            exit 0
          fi
          git commit -m "Update bubu music history"
          git push
